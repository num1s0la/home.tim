async function copyText(text) {
  try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return true; } } catch (_) {}
  try {
    const ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly", "");
    ta.style.cssText = "position:fixed; top:0; left:0; opacity:0; -webkit-user-select:text; user-select:text";
    document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0, text.length);
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  } catch (_) { return false; }
}

const ICONS = {

const linksEl = $("links");
PROFILE.links.forEach((l, idx) => {
  const a = document.createElement("a");
  a.className = "link rise";
  a.style.animationDelay = (0.55 + idx * 0.1) + "s";

  ico.innerHTML = key ? ICONS[key] : `<span style="font:700 16px 'Unbounded',sans-serif">${l.title[0]}</span>`;

  const ar = document.createElement("div"); ar.className = "arrow"; ar.textContent = "›";

  if (l.copy) {

    a.style.transform = `perspective(600px) rotateY(${px * 7}deg) rotateX(${-py * 7}deg) translateY(-2px)`;

const cursor = $("cursor");
let mx = innerWidth / 2, my = innerHeight / 2, cx = mx, cy = my;
addEventListener("pointermove", e => { mx = e.clientX; my = e.clientY; cursor.style.opacity = 1; });
document.addEventListener("pointerleave", () => cursor.style.opacity = 0);

/* ====== небо, трава, снег ====== */
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
const starCv = $("stars"), gc = $("grass"), sc = $("snow");
const st = starCv.getContext("2d"), g = gc.getContext("2d"), s2 = sc.getContext("2d");
let W, H, DPR, GH, blades = [], flakes = [], stars = [], shooters = [], nextShoot = 4000;
const rnd = (a, b) => a + Math.random() * (b - a);

function shade(L) {
  const r = Math.random();
  let h, sat, l = rnd(...L.l);
  if (r < .62)      { h = rnd(88, 135); sat = rnd(...L.s); }
  else if (r < .78) { h = rnd(58, 88);  sat = rnd(25, 45); l += 1; }
  else if (r < .90) { h = rnd(138, 168); sat = rnd(22, 40); }
  else if (r < .95) { h = rnd(36, 52);  sat = rnd(14, 26); l += 2; }
  else              { h = rnd(95, 130); sat = rnd(25, 40); l += 8; }
  return `hsl(${h},${sat}%,${l}%)`;
}

function build() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  [starCv, gc, sc].forEach(c => { c.width = W * DPR; c.height = H * DPR; });
  st.setTransform(DPR, 0, 0, DPR, 0, 0);
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  s2.setTransform(DPR, 0, 0, DPR, 0, 0);

  stars = Array.from({ length: Math.min(150, Math.round(W / 9)) }, () => ({
    x: rnd(0, W), y: rnd(0, H * 0.68),
    r: rnd(.4, 1.5), ph: rnd(0, 6.28), spd: rnd(.0008, .0025), base: rnd(.25, .8)
  }));

  GH = Math.min(H * 0.36, 320);
  const cw = Math.min(W, 1500);
  const layers = [
    { n: cw / 1.4, h: [GH * .25, GH * .5],  w: [1.4, 2.6], l: [4, 8],   s: [18, 30] },
    { n: cw / 2.0, h: [GH * .4, GH * .8],   w: [1.8, 3.4], l: [7, 12],  s: [20, 34] },
    { n: cw / 3.6, h: [GH * .6, GH * 1.15], w: [2.6, 4.6], l: [10, 17], s: [22, 38] }
  ];
  blades = [];
  layers.forEach((L, li) => {
    for (let i = 0; i < L.n; i++) {
      blades.push({
        x: rnd(-10, W + 10), h: rnd(...L.h), w: rnd(...L.w), ph: rnd(0, 6.28), layer: li,
        col: shade(L), lean: rnd(-1, 1), snow: li === 2 && Math.random() < .12
      });
    }
  });
  flakes = Array.from({ length: Math.min(180, Math.round(W / 7)) }, () => ({
    x: rnd(0, W), y: rnd(0, H), r: rnd(.6, 2.6), ph: rnd(0, 6.28)
  }));
}

function drawStars(t) {
  st.clearRect(0, 0, W, H);
  for (const s of stars) {
    const tw = still ? 1 : (.6 + .4 * Math.sin(t * s.spd + s.ph));
    st.globalAlpha = s.base * tw;
    st.fillStyle = "#dfe8ff";
    st.beginPath(); st.arc(s.x, s.y, s.r, 0, 6.283); st.fill();
  }
  st.globalAlpha = 1;
  if (!still && t > nextShoot && !shooters.length) {      // только одна за раз
    nextShoot = t + rnd(2500, 6000);
    const fromTop = Math.random() < .4;                        // то из-за верхнего края, то из-за правого
    const sx = fromTop ? rnd(W * .45, W * 1.05) : W + 12;
    const sy = fromTop ? -12 : rnd(10, H * .45);
    const ang = rnd(2.6, 3.0);                                 // строго влево, чуть вниз
    const sp = Math.min(1.6, Math.max(1, W / 1100));           // на большом экране чуть быстрее
    shooters.push({ x: sx, y: sy, vx: Math.cos(ang) * 9 * sp, vy: Math.sin(ang) * 4.5 * sp, life: 1 });
  }
  for (let i = shooters.length - 1; i >= 0; i--) {
    const sh = shooters[i];
    sh.x += sh.vx; sh.y += sh.vy; sh.life -= .014;
    if (sh.life <= 0) { shooters.splice(i, 1); continue; }
    const grd = st.createLinearGradient(sh.x, sh.y, sh.x - sh.vx * 9, sh.y - sh.vy * 9);
    grd.addColorStop(0, `rgba(255,255,255,${.85 * sh.life})`);
    grd.addColorStop(1, "rgba(255,255,255,0)");
    st.strokeStyle = grd; st.lineWidth = 1.6; st.lineCap = "round";
    st.beginPath(); st.moveTo(sh.x, sh.y);
    st.lineTo(sh.x - sh.vx * 9, sh.y - sh.vy * 9); st.stroke();
  }
}

function drawGrass(t) {
  g.clearRect(0, 0, W, H);
  const gr = g.createLinearGradient(0, H - 26, 0, H);
  gr.addColorStop(0, "rgba(6,10,8,0)"); gr.addColorStop(1, "rgba(6,10,8,1)");
  g.fillStyle = gr; g.fillRect(0, H - 26, W, 26);

  let cur = -1;
  for (const b of blades) {
    if (b.layer !== cur) {
      if (cur >= 0 && cur < 2) {
        const fg = g.createLinearGradient(0, H - GH * 1.2, 0, H);
        fg.addColorStop(0, "rgba(10,18,16,0)"); fg.addColorStop(1, "rgba(10,18,16,.35)");
        g.fillStyle = fg; g.fillRect(0, H - GH * 1.2, W, GH * 1.2);
      }
      cur = b.layer;
    }
    const wave = Math.sin(b.x * .004 - t * .0009) * .55 + Math.sin(b.x * .011 - t * .0016 + 1.7) * .3;
    const env = Math.pow(.5 + .5 * Math.sin(t * .00024 - b.x * .0014), 2);
    const wind = .3 + env * .7;
    const flutter = Math.sin(t * .0045 + b.ph * 3) * .012 * (.4 + env);
    const d = (b.lean * .1 + wave * wind * .3 + wind * .1 + flutter) * b.h;
    const bx = b.x, by = H + 2, tx = bx + d, ty = by - b.h * (1 - Math.abs(d) / b.h * .12);
    const gx = bx, gy = by - b.h * .5;
    g.fillStyle = b.col;
    g.beginPath();
    g.moveTo(bx - b.w, by);
    g.quadraticCurveTo(gx - b.w * .45, gy, tx, ty);
    g.quadraticCurveTo(gx + b.w * .45, gy, bx + b.w, by);
    g.fill();
    if (b.snow) { g.fillStyle = "rgba(235,242,248,.8)"; g.beginPath(); g.arc(tx, ty + 1, 1.1, 0, 6.283); g.fill(); }
  }
  const sh = g.createLinearGradient(0, H - GH * .7, 0, H);
  sh.addColorStop(0, "rgba(0,0,0,0)"); sh.addColorStop(1, "rgba(0,0,0,.4)");
  g.fillStyle = sh; g.fillRect(0, H - GH * .7, W, GH * .7);
}

function drawSnow(t, dt) {
  s2.clearRect(0, 0, W, H);
  const wind = Math.sin(t * .0004) * .25 + .12;
  for (const f of flakes) {
    if (!still) {
      f.y += (f.r * .28 + .35) * dt * .06;
      f.x += (Math.sin(t * .001 + f.ph) * .25 + wind * f.r * .5) * dt * .06;
      if (f.y > H + 5) { f.y = -5; f.x = rnd(0, W); }
      if (f.x > W + 5) f.x = -5; else if (f.x < -5) f.x = W + 5;
    }
    s2.fillStyle = `rgba(255,255,255,${.35 + f.r * .2})`;
    s2.beginPath(); s2.arc(f.x, f.y, f.r, 0, 6.283); s2.fill();
  }
}

let last = 0, fi = 0, lag = false, stutterUntil = 0;
function frame(t) {
  const dt = Math.min(t - last, 50); last = t;
  if (t >= stutterUntil && (!lag || fi++ % 3 === 0)) {
    drawStars(t); drawGrass(t); drawSnow(t, dt * (lag ? 3 : 1));
  }
  cx += (mx - cx) * .12; cy += (my - cy) * .12;
  cursor.style.transform = `translate3d(${cx}px,${cy}px,0) translate(-50%,-50%)`;
  if (!still) requestAnimationFrame(frame);
}
build(); requestAnimationFrame(frame);
let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { build(); if (still) frame(0); }, 150); });

/* ====== пасхалка: клик по нику → терминал tim@arch → «удаление» сайта и восстановление ====== */
const sleep = ms => new Promise(r => setTimeout(r, ms));
const term = $("term"), tout = $("tout"), nameEl = $("name");
let state = "idle";            // idle → busy → wiped → busy → idle
let idleLine = null, gl = null;
const killed = [];

const PROMPT = '<span class="pr">tim@arch</span><span class="dim">:</span><span class="pa">~/site</span><span class="dim">$ </span>';
const scroll = () => { tout.scrollTop = tout.scrollHeight; requestAnimationFrame(() => { tout.scrollTop = tout.scrollHeight; }); };
function line(html) { const d = document.createElement("div"); d.innerHTML = html; tout.appendChild(d); scroll(); return d; }
function out(txt, cls = "dim") { const d = line(`<span class="${cls}"></span>`); d.firstChild.textContent = txt; return d; }
function idlePrompt() { idleLine = line(PROMPT + '<span class="act"></span>'); }
async function cmd(text, speed = 42) {
  let d = idleLine; idleLine = null;
  if (!d) d = line(PROMPT + '<span class="act"></span>');
  const c = d.querySelector(".act");
  await sleep(250);
  for (const ch of text) { c.textContent += ch; scroll(); await sleep(speed * (.5 + Math.random())); }
  c.classList.remove("act");
  await sleep(260);
}
/* терминал ставим под ником (а если места мало — над ним), чтобы он не перекрывал и не блокировал ник */
function placeTerm() {
  const r = nameEl.getBoundingClientRect(), gap = 20, pad = 12, maxH = innerWidth >= 900 ? 380 : 300;
  const below = innerHeight - r.bottom - gap - pad, above = r.top - gap - pad;
  let h, top;
  if (below >= 170 || below >= above) { h = Math.max(110, Math.min(maxH, below)); top = r.bottom + gap; }
  else { h = Math.max(110, Math.min(maxH, above)); top = r.top - gap - h; }
  term.style.top = Math.max(pad, top) + "px"; term.style.height = h + "px";
}
const openTerm = () => { placeTerm(); term.classList.add("open"); term.setAttribute("aria-hidden", "false"); };
const closeTerm = () => { term.classList.remove("open"); term.setAttribute("aria-hidden", "true"); };

/* что исчезает, по порядку */
function targets() {
  const L = [...document.querySelectorAll(".link")].reverse();
  return [
    document.querySelector("footer"), ...L, $("tags"), $("bio"), $("handle"),
    document.querySelector(".avatar-wrap"), $("snow"), $("grass"), $("stars"),
    document.querySelector(".vignette"), $("cursor"), document.querySelector(".sky")
  ].filter(e => e && !(e.matches(".bio,.tags") && !e.textContent.trim()));
}
function kill(el) {
  const a = el.animate([{opacity:1},{opacity:.1},{opacity:.85},{opacity:0},{opacity:.4},{opacity:0}], { duration: 380, fill: "forwards" });
  a.finished.then(() => { el.style.visibility = "hidden"; }).catch(() => {});
  el._k = a;
}
function revive(el) {
  el.style.visibility = "";
  const a = el.animate([{opacity:0},{opacity:.7},{opacity:.05},{opacity:1}], { duration: 340, fill: "forwards" });
  a.finished.then(() => { a.cancel(); if (el._k) el._k.cancel(); }).catch(() => {});
}
/* лёгкие глюки: рябь цвета у текста + случайные смещения элементов */
function glitch(on) {
  document.body.classList.toggle("glitch", on);
  clearInterval(gl);
  if (!on) return;
  gl = setInterval(() => {
    const pool = [...document.querySelectorAll("#name,#handle,.avatar-wrap,.link,footer")].filter(e => e.style.visibility !== "hidden");
    for (let i = 0; i < 2 && pool.length; i++) {
      const e = pool[Math.floor(Math.random() * pool.length)];
      e.style.translate = `${rnd(-10, 10)}px ${rnd(-3, 3)}px`;
      setTimeout(() => { e.style.translate = ""; }, 70);
    }
  }, 90);
}
const stutter = () => { stutterUntil = performance.now() + rnd(150, 350); };

const RM = ["removed 'index.html'","removed 'css/glass.css'","removed 'js/grass.js'","removed 'js/snow.js'","removed 'js/terminal.js'",
  "removed 'assets/avatar.png'","removed 'assets/stars.svg'","removed directory 'assets'","removed directory 'js'",
  "removed directory 'css'","removed 'README.md'","removed 'favicon.ico'"];

async function runDelete() {
  state = "busy"; lag = true; document.body.classList.add("locked");
  openTerm(); await sleep(450);
  await cmd("sudo rm -rf ~/site/*");
  out("[sudo] password for tim: ");
  await sleep(900);
  glitch(true);
  const q = targets(), per = q.length / RM.length; let acc = 0;
  for (const f of RM) {
    await sleep(rnd(80, 160)); out(f);
    acc += per;
    while (acc >= 1 && q.length) { const e = q.shift(); kill(e); killed.push(e); acc -= 1; }
    if (Math.random() < .3) stutter();
  }
  while (q.length) { const e = q.shift(); kill(e); killed.push(e); }
  await sleep(600); glitch(false); lag = false;
  await cmd("ls ~/site");
  out("# пусто. остался только ник...");
  idlePrompt(); nameEl.classList.add("armed"); state = "wiped";
}

async function runRestore() {
  state = "busy"; lag = true; glitch(true);
  await cmd("git restore .");
  const p = out("");
  const q = [...killed].reverse(), per = q.length / 12; let acc = 0;
  for (let k = 1; k <= 12; k++) {
    await sleep(rnd(90, 170));
    p.firstChild.textContent = `Updating files: ${Math.round(k / 12 * 100)}% (${k}/12)` + (k === 12 ? ", done." : ""); scroll();
    acc += per;
    while (acc >= 1 && q.length) { revive(q.shift()); acc -= 1; }
    if (Math.random() < .25) stutter();
  }
  while (q.length) revive(q.shift());
  killed.length = 0;
  await sleep(800); glitch(false); lag = false;
  await cmd("exit");
  closeTerm(); nameEl.classList.remove("armed"); document.body.classList.remove("locked");
  await sleep(450); tout.innerHTML = ""; idleLine = null; state = "idle";
}

/* запасная защита: клики и Enter по ссылкам игнорируются, пока терминал открыт */
document.addEventListener("click", e => {
  if (document.body.classList.contains("locked") && e.target.closest(".link")) { e.preventDefault(); e.stopPropagation(); }
}, true);

function onName() { if (state === "idle") runDelete(); else if (state === "wiped") runRestore(); }
addEventListener("resize", () => { if (term.classList.contains("open")) placeTerm(); });
nameEl.setAttribute("role", "button"); nameEl.tabIndex = 0;
nameEl.addEventListener("click", onName);
nameEl.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); onName(); } });
</script>
</body>
