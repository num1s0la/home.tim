async function copyText(text) {
  try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return true; } } catch (_) {}
  try {
    const ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly", "");
    ta.style.cssText = "position:fixed; top:0; left:0; opacity:0; -webkit-user-select:text; user-select:text";
    document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0, text.length);
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  } catch (_) { return false; }
}

const ICONS = {

const linksEl = $("links");
PROFILE.links.forEach((l, idx) => {
  const a = document.createElement("a");
  a.className = "link rise";
  a.style.animationDelay = (0.55 + idx * 0.1) + "s";

  ico.innerHTML = key ? ICONS[key] : `<span style="font:700 16px 'Unbounded',sans-serif">${l.title[0]}</span>`;

  const ar = document.createElement("div"); ar.className = "arrow"; ar.textContent = "›";

  if (l.copy) {

    a.style.transform = `perspective(600px) rotateY(${px * 7}deg) rotateX(${-py * 7}deg) translateY(-2px)`;

const cursor = $("cursor");
let mx = innerWidth / 2, my = innerHeight / 2, cx = mx, cy = my;
addEventListener("pointermove", e => { mx = e.clientX; my = e.clientY; cursor.style.opacity = 1; });
document.addEventListener("pointerleave", () => cursor.style.opacity = 0);

/* ====== небо, трава, снег ====== */
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
const starCv = $("stars"), gc = $("grass"), sc = $("snow");
const st = starCv.getContext("2d"), g = gc.getContext("2d"), s2 = sc.getContext("2d");
let W, H, DPR, GH, blades = [], flakes = [], stars = [], shooters = [], nextShoot = 4000;
const rnd = (a, b) => a + Math.random() * (b - a);

function shade(L) {
  const r = Math.random();
  let h, sat, l = rnd(...L.l);
  if (r < .62)      { h = rnd(88, 135); sat = rnd(...L.s); }
  else if (r < .78) { h = rnd(58, 88);  sat = rnd(25, 45); l += 1; }
  else if (r < .90) { h = rnd(138, 168); sat = rnd(22, 40); }
  else if (r < .95) { h = rnd(36, 52);  sat = rnd(14, 26); l += 2; }
  else              { h = rnd(95, 130); sat = rnd(25, 40); l += 8; }
  return `hsl(${h},${sat}%,${l}%)`;
}

function build() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  [starCv, gc, sc].forEach(c => { c.width = W * DPR; c.height = H * DPR; });
  st.setTransform(DPR, 0, 0, DPR, 0, 0);
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  s2.setTransform(DPR, 0, 0, DPR, 0, 0);

  stars = Array.from({ length: Math.min(150, Math.round(W / 9)) }, () => ({
    x: rnd(0, W), y: rnd(0, H * 0.68),
